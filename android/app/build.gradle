plugins { id 'com.android.application' }
android {
    namespace 'tools.premade.vault'
    compileSdk 35
    defaultConfig {
        applicationId 'tools.premade.vault'
        minSdk 30
        targetSdk 35
        // CI numbers each build, so every new build installs over the last one.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "0.1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }
    // The signing key comes from the ANDROID_KEYSTORE repo secret (CI writes it here); it never goes in the repo.
    // The same key signs every build, so each one installs over the last.
    signingConfigs {
        vault { storeFile file('../vault.keystore'); storeType 'pkcs12'; storePassword 'premadevault'; keyAlias 'vault'; keyPassword 'premadevault' }
    }
    buildTypes {
        release { signingConfig signingConfigs.vault; minifyEnabled false }
        debug { signingConfig signingConfigs.vault }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
