name: Friends relay
# Puts the Friends relay (relay/) up on Cloudflare: the D1 database, the R2 bucket, then the Worker and its page.
# Needs the CLOUDFLARE_API_TOKEN secret (an "Edit Cloudflare Workers" token from the Friends Cloudflare account).
# Only the default branch deploys: the relay also hosts the phone app (/m/), so a deploy is a release for iPhones.
on:
  push:
    branches: [claude/project-thread-n24ntn]
    paths: ['relay/**', 'pc/ui/**', '.github/workflows/relay.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run: { working-directory: relay }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test (a relay that fails its test isn't deployed)
        run: node worker.test.mjs
      - name: Check the token is there
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::No CLOUDFLARE_API_TOKEN secret yet, so the relay isn't deployed."; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: Database and bucket
        if: env.SKIP != '1'
        run: |
          npm i -s wrangler@4
          npx wrangler d1 list --json > dbs.json
          ID=$(node -pe "(require('./dbs.json').find(d => d.name === 'premade-friends') || {}).uuid || ''")
          if [ -z "$ID" ]; then npx wrangler d1 create premade-friends; npx wrangler d1 list --json > dbs.json; ID=$(node -pe "require('./dbs.json').find(d => d.name === 'premade-friends').uuid"); fi
          sed -i "s/DB_ID/$ID/" wrangler.toml
          npx wrangler d1 execute premade-friends --remote --file schema.sql
          npx wrangler r2 bucket list | grep -q 'premade-friends' || npx wrangler r2 bucket create premade-friends
      - name: Worker and page
        if: env.SKIP != '1'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          sh build.sh
          set -o pipefail
          npx wrangler deploy | tee deploy.log
          # Android pop-ups (File drop): the Firebase service account, once Rayan has added it as a repo secret.
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT; fi
          echo "Relay address: $(grep -o 'https://[^ ]*workers.dev' deploy.log | head -1)"
          U=$(grep -o 'https://[^ ]*workers.dev' deploy.log | head -1)
          sleep 5
          test "$(curl -s -o /dev/null -w '%{http_code}' $U/)" = 200 || { echo "::error::The Friends page didn't load"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' $U/people)" = 401 || { echo "::error::The relay didn't answer as expected"; exit 1; }
          echo "Relay answers: page 200, people 401 without a key"
