name: Friends relay
# Puts the Friends relay (relay/) up on Cloudflare: the D1 database, the R2 bucket, then the Worker and its page.
# Needs the CLOUDFLARE_API_TOKEN secret (an "Edit Cloudflare Workers" token from the Friends Cloudflare account).
on:
  push:
    paths: ['relay/**', 'pc/ui/m/friends-core.js', 'pc/ui/friends.css', '.github/workflows/relay.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run: { working-directory: relay }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check the token is there
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::No CLOUDFLARE_API_TOKEN secret yet, so the relay isn't deployed."; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: Database and bucket
        if: env.SKIP != '1'
        run: |
          npm i -s wrangler@4
          npx wrangler d1 list --json > dbs.json
          ID=$(node -pe "(require('./dbs.json').find(d => d.name === 'premade-friends') || {}).uuid || ''")
          if [ -z "$ID" ]; then npx wrangler d1 create premade-friends; npx wrangler d1 list --json > dbs.json; ID=$(node -pe "require('./dbs.json').find(d => d.name === 'premade-friends').uuid"); fi
          sed -i "s/DB_ID/$ID/" wrangler.toml
          npx wrangler d1 execute premade-friends --remote --file schema.sql
          npx wrangler r2 bucket list | grep -q 'premade-friends' || npx wrangler r2 bucket create premade-friends
      - name: Worker and page
        if: env.SKIP != '1'
        run: |
          sh build.sh
          npx wrangler deploy | tee deploy.log
          echo "Relay address: $(grep -o 'https://[^ ]*workers.dev' deploy.log | head -1)"
