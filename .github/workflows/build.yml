name: Build
on:
  push:
    paths: ['android/**', 'pc/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      N: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - uses: actions/setup-go@v5
        with: { go-version-file: pc/go.mod }
      - name: Android app
        env: { KEYSTORE: '${{ secrets.ANDROID_KEYSTORE }}' }
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/vault.keystore && echo "SIGNED=1" >> "$GITHUB_ENV"
          else # no secret yet: sign with a throwaway key so the code is still checked, but don't release it
            keytool -genkeypair -keystore android/vault.keystore -storetype PKCS12 -storepass premadevault -keypass premadevault -alias vault -keyalg RSA -dname CN=temp
          fi
          gradle -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk pc/apk/PremadeTools.apk
          echo "$N" > pc/apk/version.txt
      - name: PC program (carries the Android app)
        run: cd pc && go vet ./... && go test ./... && GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui -s -w -X main.version=0.1.$N" -o PremadeTools.exe .
      - name: Release (the PC program updates itself from the latest one)
        if: github.ref_name == github.event.repository.default_branch && env.SIGNED == '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "v0.1.$N" pc/PremadeTools.exe pc/apk/PremadeTools.apk --title "Premade Tools 0.1.$N" --notes "Built from ${GITHUB_SHA::7}." --target "$GITHUB_SHA"
      # Also on the "builds" branch, so a chat session can fetch them with git.
      - run: |
          mkdir /tmp/out && cp pc/apk/PremadeTools.apk pc/PremadeTools.exe /tmp/out/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan builds && git rm -rqf . && cp /tmp/out/* .
          git add PremadeTools.apk PremadeTools.exe && git commit -qm "Build 0.1.$N from ${GITHUB_SHA::7}" && git push -f origin builds
