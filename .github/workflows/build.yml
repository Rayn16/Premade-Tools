name: Build
on:
  push:
    paths: ['android/**', 'pc/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - uses: actions/setup-go@v5
        with: { go-version-file: pc/go.mod }
      - run: gradle -p android assembleRelease
      - run: cd pc && go vet ./... && go test ./... && GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui -s -w" -o PremadeTools.exe .
      # The builds go on the "builds" branch so a chat session can fetch them with git and hand them over.
      - run: |
          mkdir /tmp/out && cp android/app/build/outputs/apk/release/app-release.apk /tmp/out/PremadeTools.apk && cp pc/PremadeTools.exe /tmp/out/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan builds && git rm -rqf . && cp /tmp/out/* .
          git add PremadeTools.apk PremadeTools.exe && git commit -qm "Build from ${GITHUB_SHA::7}" && git push -f origin builds
